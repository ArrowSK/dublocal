<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">DubLocal app icon</title>
  <desc id="desc">Original dark terminal-inspired icon with a neon green D-shaped audio mark and subtitle bars.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101b15"/>
      <stop offset="0.55" stop-color="#07100a"/>
      <stop offset="1" stop-color="#030604"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9dffbd"/>
      <stop offset="0.45" stop-color="#42ef83"/>
      <stop offset="1" stop-color="#17b95b"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="48" y="48" width="928" height="928" rx="228" fill="url(#bg)"/>
  <rect x="70" y="70" width="884" height="884" rx="206" fill="none" stroke="#173923" stroke-width="12"/>

  <g filter="url(#glow)" fill="none" stroke="url(#green)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M330 278v468" stroke-width="78"/>
    <path d="M330 278h132c176 0 286 92 286 234S638 746 462 746H330" stroke-width="78"/>
  </g>

  <g fill="#dfffea">
    <rect x="430" y="415" width="188" height="28" rx="14" opacity="0.92"/>
    <rect x="430" y="493" width="246" height="28" rx="14" opacity="0.78"/>
    <rect x="430" y="571" width="148" height="28" rx="14" opacity="0.92"/>
  </g>

  <g fill="url(#green)">
    <rect x="219" y="835" width="92" height="18" rx="9" opacity="0.85"/>
    <rect x="330" y="835" width="34" height="18" rx="9" opacity="0.45"/>
    <rect x="383" y="835" width="67" height="18" rx="9" opacity="0.7"/>
    <rect x="469" y="835" width="28" height="18" rx="9" opacity="0.35"/>
    <rect x="516" y="835" width="112" height="18" rx="9" opacity="0.65"/>
    <rect x="647" y="835" width="52" height="18" rx="9" opacity="0.4"/>
    <rect x="718" y="835" width="86" height="18" rx="9" opacity="0.8"/>
  </g>
</svg>
