<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">DubLocal app icon</title>
  <desc id="desc">Original dark Matrix-inspired icon with a neon green D and audio waveform.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101b15"/>
      <stop offset="0.55" stop-color="#07100a"/>
      <stop offset="1" stop-color="#030604"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a8ffbf"/>
      <stop offset="0.45" stop-color="#60f285"/>
      <stop offset="1" stop-color="#21bf58"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="48" y="48" width="928" height="928" rx="228" fill="url(#bg)"/>
  <rect x="70" y="70" width="884" height="884" rx="206" fill="none" stroke="#173923" stroke-width="12"/>

  <g opacity="0.16" fill="#42ef83" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="30">
    <text x="120" y="160">01 10 01 00</text>
    <text x="710" y="205">11 00 10</text>
    <text x="118" y="835">00 11 01</text>
    <text x="705" y="875">10 01 11</text>
  </g>

  <g filter="url(#glow)" fill="none" stroke="url(#green)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M365 260v504" stroke-width="72"/>
    <path d="M365 260h126c174 0 284 99 284 252S665 764 491 764H365" stroke-width="72"/>
  </g>

  <g fill="url(#green)" filter="url(#glow)">
    <rect x="245" y="438" width="24" height="148" rx="12"/>
    <rect x="286" y="390" width="24" height="244" rx="12"/>
    <rect x="327" y="348" width="24" height="328" rx="12"/>
    <rect x="368" y="408" width="24" height="208" rx="12"/>
    <rect x="409" y="458" width="24" height="108" rx="12"/>
  </g>
</svg>
