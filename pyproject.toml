[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dublocal"
version = "0.6.0b8"
description = "Local-first subtitle translation and AI voice-over dubbing for macOS"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "DubLocal contributors" }
]
dependencies = [
  "gradio>=5.0,<7.0",
  "huggingface-hub>=1.0,<2.0",
  "numpy>=1.26,<3.0",
  "platformdirs>=4.2,<5.0",
  "tqdm>=4.66,<5.0",
  "yt-dlp>=2025.1.1"
]

[project.optional-dependencies]
translation = [
  "torch>=2.6,<3.0",
  "transformers>=4.50,<6.0",
  "sentencepiece>=0.2,<1.0",
  "safetensors>=0.5,<1.0",
  "huggingface-hub>=1.0,<2.0"
]
kokoro = [
  "kokoro>=0.9.4",
  "misaki[ja,zh]>=0.9.4",
  "huggingface-hub>=1.0,<2.0"
]
kokoro-ru = [
  "kokoro>=0.9.4",
  "huggingface-hub>=1.0,<2.0",
  "ruaccent>=1.5.6,<2.0"
]
authenticated-web = [
  "playwright>=1.49,<2.0"
]
dev = [
  "pytest>=8.0,<9.0",
  "ruff>=0.9,<1.0"
]

[project.scripts]
dublocal = "dublocal.launcher_runtime:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dublocal"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
