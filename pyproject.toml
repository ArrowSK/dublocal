[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dublocal"
version = "0.2.0.dev0"
description = "Local-first subtitle translation and AI voice-over dubbing for macOS"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "DubLocal contributors" }
]
dependencies = [
  "gradio>=5.0,<7.0",
  "platformdirs>=4.2,<5.0",
  "yt-dlp>=2025.1.1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "ruff>=0.9,<1.0"
]

[project.scripts]
dublocal = "dublocal.launcher_runtime:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dublocal"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
