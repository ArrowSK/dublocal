name: Windows Beta Package

on:
  workflow_run:
    workflows: ["macOS Beta Package"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: windows-2022
    steps:
      - name: Check out the packaged revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Validate Windows package contracts
        shell: pwsh
        run: |
          pytest -q tests/test_windows_package.py tests/test_normal_update.py
          $errors = $null
          Get-ChildItem scripts/windows -Filter *.ps1 | ForEach-Object {
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build unsigned Windows setup
        shell: pwsh
        env:
          DUBLOCAL_BUILD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          $version = python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])"
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/windows/build-beta-installer.ps1 -Version $version -BuildSha $env:DUBLOCAL_BUILD_SHA

      - name: Upload Windows setup
        uses: actions/upload-artifact@v4
        with:
          name: DubLocal-Windows-unsigned-beta
          path: |
            dist/*-Windows-Setup-unsigned.exe
            dist/*-Windows-Setup-unsigned.exe.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Attach package to its prerelease
        if: github.event_name == 'workflow_run'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          DUBLOCAL_BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          $version = python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])"
          $tag = "v$version"
          $release = gh release view $tag --json targetCommitish,assets 2>$null | ConvertFrom-Json
          if (-not $release) { throw "The macOS workflow did not create prerelease $tag." }
          if ($release.targetCommitish -ne $env:DUBLOCAL_BUILD_SHA) {
            Write-Output "Prerelease $tag targets a different immutable revision; Windows assets were left as workflow artifacts."
            exit 0
          }
          $installer = Get-ChildItem dist\*-Windows-Setup-unsigned.exe | Select-Object -First 1
          if ($release.assets.name -contains $installer.Name) {
            Write-Output "Prerelease already contains $($installer.Name); leaving the existing asset immutable."
            exit 0
          }
          gh release upload $tag $installer.FullName "$($installer.FullName).sha256"
