name: macOS Beta Package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Test packaging and branding contracts
        run: pytest -q tests/test_beta_package.py tests/test_beta_branding.py

      - name: Validate shell scripts
        run: |
          zsh -n scripts/macos/beta-bootstrap.sh
          zsh -n scripts/macos/build-beta-dmg.sh

      - name: Build unsigned DMG
        env:
          DUBLOCAL_BUILD_SHA: ${{ github.sha }}
        run: zsh scripts/macos/build-beta-dmg.sh

      - name: Upload beta package
        uses: actions/upload-artifact@v4
        with:
          name: DubLocal-macOS-unsigned-beta
          path: |
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30
