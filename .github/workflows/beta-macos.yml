name: macOS Beta Package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Test packaging and branding contracts
        run: pytest -q tests/test_beta_package.py tests/test_beta_branding.py

      - name: Validate shell scripts
        run: |
          zsh -n scripts/macos/beta-bootstrap.sh
          zsh -n scripts/macos/build-beta-dmg.sh

      - name: Build unsigned DMG
        env:
          DUBLOCAL_BUILD_SHA: ${{ github.sha }}
        run: zsh scripts/macos/build-beta-dmg.sh

      - name: Upload beta package
        uses: actions/upload-artifact@v4
        with:
          name: DubLocal-macOS-unsigned-beta
          path: |
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish versioned GitHub prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(python - <<'PY'
          import tomllib
          from pathlib import Path
          print(tomllib.loads(Path('pyproject.toml').read_text())['project']['version'])
          PY
          )"
          TAG="v${VERSION}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists; leaving its published assets immutable."
            exit 0
          fi

          gh release create "$TAG" \
            dist/*.dmg \
            dist/*.sha256 \
            --target "$GITHUB_SHA" \
            --title "DubLocal ${VERSION} — macOS beta" \
            --notes-file docs/RELEASE_NOTES_0.6.0b1.md \
            --prerelease
